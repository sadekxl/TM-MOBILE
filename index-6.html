  scrollChatToBottom();
}
function renderChatMessagesHtml(){
  return state.chat.map(function(m){
    const cls = m.role==='user' ? 'user' : 'assistant';
    return '<div class="msg '+cls+'">'+esc(m.content)+'</div>';
  }).join('') + (state.chatLoading ? '<div class="msg assistant loading">المساعد يكتب...</div>' : '');
}
function scrollChatToBottom(){
  const el = document.getElementById('aiMessages');
  if(el) el.scrollTop = el.scrollHeight;
}
function sendChatMessage(text){
  text = (text||'').trim();
  if(!text || state.chatLoading) return;
  state.chat.push({role:'user', content:text});
  const input = document.getElementById('aiInput');
  if(input) input.value = '';
  const msgsEl = document.getElementById('aiMessages');
  if(msgsEl) msgsEl.innerHTML = renderChatMessagesHtml();
  scrollChatToBottom();
  state.chatLoading = true;
  if(msgsEl) msgsEl.innerHTML = renderChatMessagesHtml();
  scrollChatToBottom();
  callAI();
}
function buildDataContext(){
  const now = new Date();
  const repairsSlim = state.repairs.map(function(r){
    return {تذكرة:r.ticketNo, زبون:r.customerName, جهاز:(r.deviceType+' '+(r.deviceModel||'')).trim(), عطل:r.issue, حالة:r.status, تكلفة_مقدرة:Number(r.estimatedCost||0), تكلفة_فعلية:Number(r.actualCost||0), استلام:r.receivedDate};
  });
  const invoicesSlim = state.invoices.map(function(i){
    return {فاتورة:i.invoiceNo, زبون:i.customerName, تاريخ:i.date, مجموع:Number(i.total||0), حالة:i.status, دفع:i.paymentMethod};
  });
  const expensesSlim = state.expenses.map(function(e){
    return {وصف:e.description, تصنيف:e.category, مبلغ:Number(e.amount||0), تاريخ:e.date};
  });
  const unpaid = state.invoices.filter(function(i){ return i.status==='غير مدفوعة'; });
  const unpaidTotal = unpaid.reduce(function(s,i){ return s+Number(i.total||0); },0);
  const monthRevenue = state.invoices.filter(function(i){ return i.status==='مدفوعة' && sameMonth(i.date, now); }).reduce(function(s,i){ return s+Number(i.total||0); },0);
  const monthExpenses = state.expenses.filter(function(e){ return sameMonth(e.date, now); }).reduce(function(s,e){ return s+Number(e.amount||0); },0);

  return 'تاريخ اليوم: '+now.toLocaleDateString('ar-EG')+'\n'+
    'العملة الحالية: '+currentCurrencySymbol()+'\n'+
    'عدد تذاكر الصيانة: '+state.repairs.length+'\n'+
    'عدد الفواتير: '+state.invoices.length+' (غير مدفوعة: '+unpaid.length+' بقيمة '+money(unpaidTotal)+')\n'+
    'إيرادات الفواتير المدفوعة هذا الشهر: '+money(monthRevenue)+'\n'+
    'مصاريف هذا الشهر: '+money(monthExpenses)+'\n\n'+
    'بيانات تذاكر الصيانة (JSON):\n'+JSON.stringify(repairsSlim)+'\n\n'+
    'بيانات الفواتير (JSON):\n'+JSON.stringify(invoicesSlim)+'\n\n'+
    'بيانات المصاريف (JSON):\n'+JSON.stringify(expensesSlim);
}
async function callAI(){
  if(!state.ai.apiKey){
    state.chat.push({role:'assistant', content:'لتشغيل المساعد الذكي، أضف مفتاح Gemini API (مجاني من Google AI Studio) من قسم الإعدادات.'});
    state.chatLoading = false;
    const el = document.getElementById('aiMessages');
    if(el){ el.innerHTML = renderChatMessagesHtml(); scrollChatToBottom(); }
    renderAI();
    return;
  }
  try{
    const context = buildDataContext();
    const systemPrompt = 'أنت "مساعد '+state.shopInfo.name+'" — مساعد ذكاء اصطناعي متخصص بالمحاسبة وإدارة صيانة الهواتف والأجهزة، تعمل داخل نظام إدارة المحل في '+state.shopInfo.address+'. صاحب المحل يستخدمك مباشرة من داخل التطبيق، ولديك بيانات المحل الحية (تذاكر الصيانة، الفواتير، والمصاريف) المرفقة أدناه في كل رسالة.\n\n'+
      'مهامك:\n- الإجابة عن أي سؤال يتعلق بحالة الأجهزة، عدد التذاكر المفتوحة، الفواتير المستحقة، والأرباح التقديرية (الإيرادات ناقص المصاريف).\n- تقديم حسابات دقيقة بالاعتماد على البيانات المرفقة فقط دون تخمين أرقام غير موجودة.\n- تقديم نصائح عملية لتنظيم المحل وتحسين تدفق الصيانة وتحصيل الفواتير المتأخرة.\n- إذا سُئلت عن معلومة غير متوفرة في البيانات المرفقة، وضّح ذلك بصراحة بدل الافتراض.\n\n'+
      'أجب دائماً باللغة العربية بأسلوب مباشر وعملي ومختصر.\n\nبيانات المحل الحالية:\n'+context;

    const contents = state.chat.filter(function(m){ return !m.synthetic; }).map(function(m){
      return { role: m.role==='assistant' ? 'model' : 'user', parts:[{text:m.content}] };
    });

    const model = state.ai.model || 'gemini-2.5-flash';
    const resp = await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+model+':generateContent', {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'x-goog-api-key': state.ai.apiKey},
      body: JSON.stringify({ systemInstruction: {parts:[{text:systemPrompt}]}, contents: contents })
    });
    const data = await resp.json();
    let textOut = '';
    if(data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts){
      textOut = data.candidates[0].content.parts.map(function(p){ return p.text||''; }).join('\n');
    }
    if(!textOut){
      textOut = (data && data.error && data.error.message) ? ('حدث خطأ من Gemini: '+data.error.message) : 'عذراً، لم أستطع معالجة الطلب. حاول مجدداً.';
    }
    state.chat.push({role:'assistant', content:textOut});
  } catch(e){
    console.error('AI call failed', e);
    state.chat.push({role:'assistant', content:'حدث خطأ في الاتصال بالمساعد الذكي. تحقق من مفتاح API والاتصال بالإنترنت.'});
  } finally {
    state.chatLoading = false;
    const el = document.getElementById('aiMessages');
    if(el){ el.innerHTML = renderChatMessagesHtml(); scrollChatToBottom(); }
  }
}

    html += '<div class="field"><label>تنبيه إذا تجاوز المصروف الواحد</label><input type="number" min="0" id="set_expense_alert" value="'+(sm.expenseAlertThreshold!=null?sm.expenseAlertThreshold:0)+'"></div>';
    html += '<div class="hint-box">اتركه 0 لتعطيل تنبيه المصاريف. هذه التنبيهات تظهر داخل التطبيق لكل من يستخدمه أثناء فتحه (تنبيه فوري لحظة الحفظ)؛ لإرسال إشعارات فعلية للهاتف حتى والتطبيق مغلق يلزم ضبط إضافي على مستوى الخادم (Cloud Functions) — راجع SETUP.md.</div>';

}
async function saveAlertThresholds(){
  const lowStock = Number(document.getElementById('set_low_stock').value||0);
  const expenseAlert = Number(document.getElementById('set_expense_alert').value||0);
  state.shopMeta = Object.assign({}, state.shopMeta, {lowStockThreshold: lowStock, expenseAlertThreshold: expenseAlert});
  try{
    await fsRefs.setDoc(fsRefs.doc(fsRefs.db, 'shops', state.cloud.shopId), state.shopMeta, {merge:true});
    logAudit('تعديل', 'shopMeta', null);
    showToast('تم حفظ حدود التنبيهات');
  }catch(e){ console.error(e); showToast('تعذّر الحفظ'); }
}

/* ---- users & permissions management (admin) ---- */
function userCan(user, perm){
  if(!user) return false;
  if(user.role==='admin') return true;
  return !!(user.permissions && user.permissions[perm]);
}
function usersListHtml(list){
  if(list.length===0) return '<p class="hint">لا يوجد مستخدمون.</p>';
  return list.map(function(u){
    const isSelf = state.currentUser && state.currentUser.id===u.id;
    const permTags = u.role==='admin' ? 'كل الصلاحيات' : [
      (userCan(u,'settings')?'الإعدادات':null),
      (userCan(u,'expenses')?'المصاريف':null)
    ].filter(Boolean).join(' + ') || 'عمليات أساسية فقط';
    return '<div class="customer-card">'+
      '<div style="display:flex;align-items:center;gap:10px;">'+avatarHtml(u,40)+
        '<div><div class="cc-name">'+esc(u.displayName)+(isSelf?' <span style="color:var(--text-mute);font-size:11px;">(أنت)</span>':'')+(u.disabled?' <span style="color:var(--danger);font-size:11px;">(معطَّل)</span>':'')+'</div>'+
        '<div class="cc-phone">@'+esc(u.username)+' — '+(u.role==='admin'?'مدير':'موظف')+' · '+permTags+'</div></div>'+
      '</div>'+
      '<div class="cell-actions">'+
        '<button class="icon-btn" title="تعديل" onclick="openUserForm(\''+u.id+'\')">'+ICONS.edit+'</button>'+
        (isSelf?'':'<button class="icon-btn" title="'+(u.disabled?'تفعيل':'تعطيل')+'" onclick="toggleUserDisabled(\''+u.id+'\', '+(!u.disabled)+')" style="color:'+(u.disabled?'var(--success)':'var(--danger)')+';">'+(u.disabled?ICONS.check:ICONS.trash)+'</button>')+
      '</div>'+
    '</div>';
  }).join('');
}
function refreshUsersList(){
  const wrap = document.getElementById('usersListWrap');
  if(wrap) wrap.innerHTML = usersListHtml(state.users.slice().sort(function(a,b){ return (a.createdAt||0)-(b.createdAt||0); }));
}
function openUserForm(id){
  const editing = !!id;
  const u = editing ? state.users.find(function(x){ return x.id===id; }) : null;
  const perms = (u && u.permissions) || {settings:false, expenses:false};
  const role = u ? u.role : 'employee';
  const html = ''+
  '<div class="modal-head"><div><h2>'+(editing?'تعديل المستخدم':'مستخدم جديد')+'</h2><div class="modal-sub">'+(editing?'':'أنشئ اسم مستخدم وكلمة مرور وأرسلهما للموظف')+'</div></div><button class="close-x" onclick="closeModal()">'+ICONS.close+'</button></div>'+
  '<div class="field"><label>الاسم المعروض *</label><input id="uf_name" value="'+esc(u?u.displayName:'')+'" placeholder="مثال: سامر"></div>'+
  '<div class="field"><label>اسم المستخدم *</label><input id="uf_username" value="'+esc(u?u.username:'')+'" autocomplete="off" placeholder="samer" '+(editing?'disabled':'')+'></div>'+
  (editing
    ? '<p class="hint">لا يمكن تغيير اسم المستخدم بعد الإنشاء. لتغيير كلمة المرور، يقوم الموظف نفسه بذلك من صفحة "حسابي" بعد تسجيل الدخول.</p>'
    : '<div class="field"><label>كلمة المرور * <span class="opt">(6 خانات على الأقل)</span></label><input type="password" id="uf_password"></div>')+
  '<div class="field"><label>الدور</label><select id="uf_role" onchange="onUserRoleChange(this.value)">'+
    '<option value="employee" '+(role==='employee'?'selected':'')+'>موظف (صلاحيات محدودة)</option>'+
    '<option value="admin" '+(role==='admin'?'selected':'')+'>مدير (كل الصلاحيات)</option>'+
  '</select></div>'+
  '<div id="uf_perms_wrap" style="'+(role==='admin'?'display:none;':'')+'">'+
    '<div class="switch-row"><span>السماح بالوصول إلى الإعدادات</span><label class="switch"><input type="checkbox" id="uf_perm_settings" '+(perms.settings?'checked':'')+'><span class="track"><span class="thumb"></span></span></label></div>'+
    '<div class="switch-row"><span>السماح بالوصول إلى المصاريف</span><label class="switch"><input type="checkbox" id="uf_perm_expenses" '+(perms.expenses?'checked':'')+'><span class="track"><span class="thumb"></span></span></label></div>'+
  '</div>'+
  '<div class="modal-actions"><button class="btn btn-outline" onclick="closeModal()">إلغاء</button><button class="btn btn-gold" onclick="saveUserForm(\''+(editing?id:'')+'\')">'+ICONS.check+(editing?'حفظ التعديلات':'إضافة المستخدم')+'</button></div>';
  openModal(html);
}
function onUserRoleChange(role){
  const wrap = document.getElementById('uf_perms_wrap');
  if(wrap) wrap.style.display = role==='admin' ? 'none' : 'block';
}
async function saveUserForm(id){
  const name = document.getElementById('uf_name').value.trim();
  const username = document.getElementById('uf_username').value.trim();
  const role = document.getElementById('uf_role').value;
  const perms = {
    settings: document.getElementById('uf_perm_settings').checked,
    expenses: document.getElementById('uf_perm_expenses').checked
  };
  if(!name || !username){ showToast('الرجاء إدخال الاسم واسم المستخدم'); return; }

  if(!id){
    const password = document.getElementById('uf_password').value;
    if(!password || password.length<6){ showToast('كلمة المرور يجب أن تكون 6 خانات على الأقل'); return; }
    try{
      const email = syntheticEmail(username, state.cloud.shopId);
      const uid = await createStaffAuthAccount(email, password);
      const data = { id: uid, username: username, displayName: name, role: role, permissions: perms, photo: null, createdAt: Date.now(), disabled: false };
      await persistRecord('users', data);
      await syncPublicStaffDoc(uid, username, name);
      closeModal();
      refreshUsersList();
      showToast('تمت إضافة المستخدم — أعطِ الموظف اسم المستخدم وكلمة المرور ليسجّل الدخول');
    }catch(e){
      console.error(e);
      showToast(e && e.code==='auth/email-already-in-use' ? 'اسم المستخدم هذا محجوز، اختر اسماً آخر' : 'تعذّر إنشاء الحساب');
    }
    return;
  }

  const existing = state.users.find(function(x){ return x.id===id; });
  const data = Object.assign({}, existing, { displayName: name, role: role, permissions: perms });
  await persistRecord('users', data);
  await syncPublicStaffDoc(id, data.username, name);
  if(state.currentUser && state.currentUser.id===id){ state.currentUser = data; }
  closeModal();
  refreshUsersList();
  showToast('تم حفظ التعديلات');
}
async function toggleUserDisabled(id, disabled){
  const target = state.users.find(function(x){ return x.id===id; });
  if(!target) return;
  const admins = state.users.filter(function(u){ return u.role==='admin' && !u.disabled; });
  if(disabled && target.role==='admin' && admins.length<=1){ showToast('لا يمكن تعطيل آخر حساب مدير نشط'); return; }
  const msg = disabled
    ? 'هل تريد تعطيل هذا الحساب؟ لن يستطيع صاحبه تسجيل الدخول بعد الآن، ولن يظهر اسمه في شاشة الدخول.'
    : 'إعادة تفعيل هذا الحساب — سيستطيع صاحبه تسجيل الدخول من جديد.';
  if(!confirm(msg)) return;
  const data = Object.assign({}, target, { disabled: disabled });
  await persistRecord('users', data);
  if(disabled) await removePublicStaffDoc(id);
  else await syncPublicStaffDoc(id, data.username, data.displayName);
  refreshUsersList();
  showToast(disabled ? 'تم تعطيل الحساب' : 'تم تفعيل الحساب');
}
function saveAISection(){
  state.ai.apiKey = document.getElementById('set_gemini_key').value.trim();
  state.ai.model = document.getElementById('set_gemini_model').value.trim() || 'gemini-2.5-flash';
  saveDeviceAI();
  showToast('تم حفظ إعدادات المساعد الذكي');
}

  return '<div class="table-wrap"><div class="empty">'+ICONS[icon]+'<h3>'+title+'</h3><p>'+desc+'</p>'+actionHtml+'</div></div>';

function openModal(html){
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('modalContent').innerHTML = '';
}
document.addEventListener('keydown', function(e){
  if(e.key==='Escape') closeModal();
});
