<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>TM Mobile | نظام إدارة الصيانة والفوترة</title>
<!-- PWA / iOS home-screen support -->
<meta name="theme-color" content="#1F1F1F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TM Mobile">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Outfit:wght@500;700;800&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{
  --black:#1F1F1F;
  --black-2:#141414;
  --black-soft:#2c2c2c;
  --gold:#D4AF37;
  --gold-light:#e7c766;
  --gold-dark:#a3822c;
  --bg:#F7F5F0;
  --surface:#FFFFFF;
  --surface-2:#FAF7F0;
  --line:#E6E1D6;
  --text:#1F1F1F;
  --text-mute:#79736a;
  --danger:#a8402a;
  --success:#347a48;
  --info:#2f6da8;
  --waiting:#c05e1a;
  --apology:#7a4fa0;
  --radius:10px;
  --safe-b:env(safe-area-inset-bottom, 0px);
}
[data-theme="dark"]{
  --bg:#15130f;
  --surface:#221f19;
  --surface-2:#282419;
  --line:#3b352b;
  --text:#EDE9E0;
  --text-mute:#a89f8f;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'IBM Plex Sans Arabic','Cairo',Tahoma,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  direction:rtl;
  min-height:100vh;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  transition:background .2s,color .2s;
}
h1,h2,h3,.nav-item span,.modal h2,.print-shop h2,.empty h3{font-family:'Cairo','IBM Plex Sans Arabic',sans-serif;}
.auth-box h2,.welcome-card h2{font-family:'Lalezar','Cairo',sans-serif;font-size:26px;font-weight:400;letter-spacing:.5px;}

/* ---------- Liquid Glass: floating decorative background blobs ---------- */
#bgBlobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;}
#bgBlobs span{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;will-change:transform;}
#bgBlobs span:nth-child(1){width:340px;height:340px;background:radial-gradient(circle,#D4AF37,transparent 70%);top:-90px;right:-60px;animation:blobFloat1 22s ease-in-out infinite;}
#bgBlobs span:nth-child(2){width:280px;height:280px;background:radial-gradient(circle,#e8ca6e,transparent 70%);bottom:5%;left:-80px;animation:blobFloat2 26s ease-in-out infinite;}
#bgBlobs span:nth-child(3){width:220px;height:220px;background:radial-gradient(circle,#8a6d20,transparent 70%);top:40%;left:35%;animation:blobFloat3 30s ease-in-out infinite;opacity:.35;}
[data-theme="dark"] #bgBlobs span{opacity:.28;}
@keyframes blobFloat1{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-30px,40px) scale(1.15);}}
@keyframes blobFloat2{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(40px,-30px) scale(1.1);}}
@keyframes blobFloat3{0%,100%{transform:translate(0,0) scale(1);}50%{transform:translate(-25px,-35px) scale(1.2);}}
@media (prefers-reduced-motion: reduce){#bgBlobs span{animation:none !important;}}

/* ---------- Liquid Glass: shared vars ---------- */
:root{--glass-bg:rgba(255,255,255,.62);--glass-border:rgba(255,255,255,.55);--glass-strong:rgba(255,255,255,.7);}
[data-theme="dark"]{--glass-bg:rgba(34,31,25,.58);--glass-border:rgba(255,255,255,.08);--glass-strong:rgba(40,37,30,.75);}
.shine{position:relative;overflow:hidden;}
.shine::before{content:'';position:absolute;inset:0;border-radius:inherit;background:linear-gradient(135deg,rgba(255,255,255,.32) 0%,rgba(255,255,255,0) 42%);pointer-events:none;}
.brand-word,.stat-num,.ticket-badge,.tot-final,.grand{font-family:'Outfit','Cairo','Tajawal',sans-serif;letter-spacing:.2px;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
button{-webkit-tap-highlight-color:transparent;}

/* ---------- loading / auth screens ---------- */
#loadingScreen,.auth-screen{position:fixed;inset:0;background:radial-gradient(ellipse at 50% -10%, #2b2820 0%, var(--black) 55%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;gap:16px;z-index:200;padding:20px;text-align:center;}
#loadingScreen .logo-mark,.auth-screen .logo-mark{width:64px;height:74px;}
.loading-txt{font-weight:700;font-size:14px;color:#cfc9bd;}
.pulse{animation:pulseFade 1.5s ease-in-out infinite;}
@keyframes pulseFade{0%,100%{opacity:1}50%{opacity:.45}}
.auth-screen{display:none;}
.auth-screen.show{display:flex;}
.auth-box{background:rgba(36,32,28,.6);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:26px 26px 22px;width:100%;max-width:320px;box-shadow:0 20px 50px rgba(0,0,0,.45);animation:authIn .35s cubic-bezier(.2,.9,.3,1.2);}
@keyframes authIn{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:none;}}
.auth-box h2{margin:0 0 4px;font-size:18px;color:#fff;font-weight:800;}
.auth-box p{margin:0 0 16px;font-size:12.5px;color:#b8b1a4;}
.auth-field{margin-bottom:11px;text-align:right;}
.auth-field label{display:block;font-size:11.5px;color:#a89f8f;margin-bottom:5px;font-weight:700;}
.auth-box input{width:100%;padding:11px 12px;border-radius:8px;border:1.5px solid #45403a;background:#1a1815;color:#fff;font-size:14px;box-sizing:border-box;}
.auth-box input:focus{outline:none;border-color:var(--gold);}
.auth-box .btn{margin-top:6px;}
.lock-err{color:#e08a6f;font-size:12px;margin-top:8px;min-height:16px;}
.staff-picker-list{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow-y:auto;margin:4px 0 6px;}
.staff-pick-btn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1.5px solid #45403a;background:#1a1815;color:#fff;font-size:14px;cursor:pointer;text-align:right;}
.staff-pick-btn:hover{border-color:var(--gold);}
.device-row,.audit-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);}
.device-row:last-child,.audit-row:last-child{border-bottom:none;}
.device-meta{font-size:12px;color:var(--text-mute);line-height:1.6;}
.device-badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;margin-inline-end:6px;}
.device-badge.ok{background:rgba(52,122,72,.14);color:var(--success);}
.device-badge.revoked{background:rgba(168,64,42,.14);color:var(--danger);}

/* ---------- welcome overlay ---------- */
#welcomeOverlay{position:fixed;inset:0;z-index:210;display:none;align-items:center;justify-content:center;background:rgba(15,14,11,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);}
#welcomeOverlay.show{display:flex;animation:overlayIn .25s ease;}
.welcome-card{background:rgba(36,32,28,.7);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:34px 30px;text-align:center;color:#fff;box-shadow:0 24px 60px rgba(0,0,0,.4);animation:welcomeIn .5s cubic-bezier(.2,.9,.25,1.3);cursor:pointer;}
@keyframes welcomeIn{0%{opacity:0;transform:scale(.85) translateY(14px);}60%{opacity:1;transform:scale(1.03) translateY(-4px);}100%{opacity:1;transform:none;}}
.welcome-card p{color:#c9c2b3;font-size:13px;margin:6px 0 0;}

/* ---------- logo mark ---------- */
.logo-mark{position:relative;flex-shrink:0;display:inline-block;}
.logo-mark svg{width:100%;height:100%;display:block;}

/* ---------- app shell ---------- */
#app{display:none;min-height:100vh;min-height:100dvh;}
#app.ready{display:flex;}

.sidebar{width:224px;background:rgba(20,20,20,.72);-webkit-backdrop-filter:blur(18px) saturate(160%);backdrop-filter:blur(18px) saturate(160%);color:#fff;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;height:100dvh;z-index:30;border-left:1px solid rgba(255,255,255,.06);}
.sidebar-logo{padding:20px 18px 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08);color:#fff;}
.sidebar-logo .logo-mark{width:32px;height:37px;}
.brand-word{font-weight:800;font-size:15px;letter-spacing:.3px;line-height:1.2;color:#fff;}
.brand-word .gold{color:var(--gold);}
.brand-sub{font-size:10px;color:#9c968b;margin-top:1px;font-family:'IBM Plex Sans Arabic',sans-serif;font-weight:500;}

.nav{flex:1;padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:8px;color:#cfc9bd;background:transparent;border:none;text-align:right;font-size:13.5px;font-weight:700;width:100%;transition:background .15s,color .15s;flex-shrink:0;}
.nav-item svg{width:18px;height:18px;flex-shrink:0;}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff;}
.nav-item.active{background:var(--gold);color:var(--black);}

.sidebar-foot{padding:12px 18px;font-size:10.5px;color:#8f8a7f;border-top:1px solid rgba(255,255,255,.08);line-height:1.7;}
.sidebar-foot button{background:transparent;border:1px solid rgba(255,255,255,.15);color:#cfc9bd;font-size:11px;padding:5px 10px;border-radius:6px;margin-top:6px;}

.main{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{background:var(--glass-bg);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);border-bottom:1px solid var(--glass-border);padding:16px 26px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20;}
.topbar-titles h1{font-size:19px;margin:0;font-weight:800;}
.topbar-titles .sub{font-size:12px;color:var(--text-mute);margin-top:2px;}
.topbar-mobile-logo{display:none;align-items:center;gap:8px;color:var(--text);}
.topbar-mobile-logo .logo-mark{width:24px;height:28px;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.topbar-date{font-size:12px;color:var(--text-mute);text-align:left;display:none;}
.theme-toggle{width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--text-mute);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.theme-toggle svg{width:16px;height:16px;}

.view{display:none;padding:22px 26px calc(90px + var(--safe-b));max-width:1180px;animation:fadeIn .25s ease;}
.view.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

/* buttons */
.btn{border:none;border-radius:8px;padding:10px 16px;font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;transition:transform .08s,background .15s,border-color .15s,box-shadow .15s;}
.btn:active{transform:scale(.97);}
.btn svg{width:15px;height:15px;}
.btn-gold{background:var(--gold);color:var(--black);position:relative;overflow:hidden;isolation:isolate;}
.btn-gold::after{content:'';position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .5s ease;}
.btn-gold:hover::after{left:130%;}
.btn-gold:hover{background:var(--gold-light);box-shadow:0 3px 10px rgba(212,175,55,.35);}
.btn-dark{background:var(--black);color:#fff;}
.btn-dark:hover{background:var(--black-soft);}
.btn-outline{background:transparent;border:1.5px solid var(--line);color:var(--text);}
.btn-outline:hover{border-color:var(--gold);}
.btn-ghost{background:transparent;color:var(--text-mute);padding:7px 9px;border-radius:6px;}
.btn-ghost:hover{color:var(--text);background:#00000008;}
.btn-danger-ghost{background:transparent;color:var(--danger);padding:7px 9px;border-radius:6px;}
.btn-danger-ghost:hover{background:#a8402a12;}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:6px;}
.btn-block{width:100%;justify-content:center;}
.icon-btn{width:33px;height:33px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;border:1.5px solid var(--line);background:var(--surface);color:var(--text-mute);flex-shrink:0;}
.icon-btn:hover{border-color:var(--gold);color:var(--text);}
.icon-btn.wa:hover{border-color:#25D366;color:#25D366;}
.icon-btn svg{width:15px;height:15px;}

/* section head */
.section-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
.section-head h2{font-size:16px;margin:0;font-weight:800;position:relative;padding-right:12px;}
.section-head h2::before{content:'';position:absolute;right:0;top:2px;bottom:2px;width:4px;border-radius:3px;background:linear-gradient(180deg,var(--gold),var(--gold-dark));}
.section-head .head-actions{display:flex;gap:8px;flex-wrap:wrap;}

/* stat cards */
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:14px;margin-bottom:24px;}
.stat-card{background:var(--glass-bg);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);border:1px solid var(--glass-border);border-radius:var(--radius);padding:16px 16px 14px;border-bottom:3px solid var(--gold);transition:transform .2s cubic-bezier(.2,.9,.3,1.2),box-shadow .2s;overflow:hidden;position:relative;}
.stat-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.32) 0%,rgba(255,255,255,0) 42%);pointer-events:none;}
.stat-card{animation:cardPop .45s cubic-bezier(.2,.9,.3,1.2) backwards;}
.stat-card:nth-child(1){animation-delay:.02s;}
.stat-card:nth-child(2){animation-delay:.07s;}
.stat-card:nth-child(3){animation-delay:.12s;}
.stat-card:nth-child(4){animation-delay:.17s;}
.stat-card:nth-child(5){animation-delay:.22s;}
@keyframes cardPop{from{opacity:0;transform:translateY(12px) scale(.95);}to{opacity:1;transform:none;}}
.stat-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.06);}
.stat-card .stat-top{display:flex;align-items:center;justify-content:space-between;}
.stat-card svg{width:17px;height:17px;color:var(--gold-dark);}
.stat-card .stat-label{font-size:12px;color:var(--text-mute);font-weight:700;margin-top:8px;}
.stat-card .stat-num{font-size:22px;font-weight:800;margin-top:2px;}
.stat-card.warn{border-bottom-color:var(--waiting);}
.stat-card.warn svg{color:var(--waiting);}
.stat-card.good{border-bottom-color:var(--info);}
.stat-card.good svg{color:var(--info);}
.stat-card.cash{border-bottom-color:var(--success);}
.stat-card.cash svg{color:var(--success);}

.dash-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start;}
.panel{background:var(--glass-bg);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);border:1px solid var(--glass-border);border-radius:var(--radius);padding:16px 16px 6px;margin-bottom:16px;}
.panel h3{font-size:13.5px;margin:0 0 10px;font-weight:800;}
.panel p.hint{font-size:11.5px;color:var(--text-mute);margin:-6px 0 12px;}
.mini-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;gap:10px;}
.mini-row:last-child{border-bottom:none;}
.mini-row .mr-main{font-weight:700;}
.mini-row .mr-sub{color:var(--text-mute);font-size:11.5px;margin-top:1px;}

/* toolbar */
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
.chip{padding:7px 14px;border-radius:20px;font-size:12.5px;font-weight:700;border:1.5px solid var(--line);background:var(--surface);color:var(--text-mute);white-space:nowrap;}
.chip.active{background:var(--black);color:#fff;border-color:var(--black);}
.search-wrap{position:relative;flex:1;min-width:180px;}
.search-wrap svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-mute);}
.search-input{width:100%;padding:9px 36px 9px 14px;border:1.5px solid var(--line);border-radius:20px;font-size:13px;background:var(--surface);color:var(--text);}
.search-input:focus{outline:none;border-color:var(--gold);}

/* table */
.table-wrap{background:var(--glass-bg);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);border:1px solid var(--glass-border);border-radius:var(--radius);overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px;}
th{text-align:right;padding:12px 14px;background:var(--surface-2);font-size:11.5px;color:var(--text-mute);font-weight:800;border-bottom:1px solid var(--line);white-space:nowrap;}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tbody tr:hover td{background:var(--surface-2);}
.cell-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;}
.cell-name{font-weight:700;}
.cell-sub{color:var(--text-mute);font-size:11.5px;margin-top:1px;}
.status-select{border:1.5px solid var(--line);border-radius:16px;padding:5px 10px;font-size:11px;font-weight:700;background:var(--surface);color:var(--text);max-width:150px;}
.low-stock{color:var(--danger);font-weight:800;}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800;white-space:nowrap;}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}
.pill.st-progress{background:#FBF0D9;color:#a8792a;}
.pill.st-waitingpart{background:#FCE8D8;color:#c05e1a;}
.pill.st-ready{background:#DEEBFB;color:#2f6da8;}
.pill.st-delivered{background:#DFF1E2;color:#347a48;}
.pill.st-apology{background:#EDE3F2;color:#7a4fa0;}
.pill.st-cancelled{background:#F6E1DD;color:#a8402a;}
.pill.paid{background:#DFF1E2;color:#347a48;}
.pill.unpaid{background:#FBF0D9;color:#a8792a;}
[data-theme="dark"] .pill{filter:brightness(1.35) saturate(1.1);}

.ticket-badge{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:26px;padding:0 8px;border-radius:7px;background:var(--black);color:var(--gold);font-weight:800;font-size:10.5px;}

/* empty state */
.empty{padding:60px 20px;text-align:center;color:var(--text-mute);}
.empty svg{width:42px;height:42px;stroke:var(--line);margin-bottom:10px;}
.empty h3{margin:6px 0 4px;font-size:15px;color:var(--text);}
.empty p{margin:0 0 16px;font-size:13px;}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(20,18,14,.6);display:none;align-items:flex-start;justify-content:center;padding:26px 14px;z-index:60;overflow-y:auto;backdrop-filter:blur(2px);}
.overlay.open{display:flex;animation:overlayIn .18s ease;}
@keyframes overlayIn{from{background:rgba(20,18,14,0);}to{background:rgba(20,18,14,.6);}}
.modal{background:var(--glass-strong);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);border:1px solid var(--glass-border);border-radius:16px;width:100%;max-width:560px;padding:22px 22px 22px;margin-top:16px;max-height:92vh;overflow-y:auto;box-shadow:0 24px 60px rgba(0,0,0,.3);animation:modalIn .22s cubic-bezier(.2,.9,.3,1.2);}
@keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.97);}to{opacity:1;transform:none;}}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.modal h2{margin:0 0 3px;font-size:17px;font-weight:800;}
.modal .modal-sub{font-size:12px;color:var(--text-mute);}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px;color:var(--text-mute);}
.field label .opt{font-weight:500;opacity:.7;}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;font-size:13.5px;background:var(--surface);color:var(--text);}
.field textarea{resize:vertical;min-height:56px;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--gold);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.field-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap;}
.close-x{background:transparent;border:none;color:var(--text-mute);width:30px;height:30px;border-radius:7px;flex-shrink:0;}
.close-x:hover{background:#00000010;color:var(--text);}
.close-x svg{width:16px;height:16px;}
.hint-box{background:var(--surface-2);border:1px dashed var(--line);border-radius:8px;padding:9px 11px;font-size:11.5px;color:var(--text-mute);margin-bottom:12px;line-height:1.6;}
fieldset.field{border:1.5px solid var(--line);border-radius:10px;padding:12px;margin-bottom:14px;}
fieldset.field legend{font-size:12px;font-weight:800;color:var(--text-mute);padding:0 6px;}

/* invoice items */
.item-row{display:grid;grid-template-columns:1fr 54px 84px 26px;gap:7px;margin-bottom:7px;align-items:center;}
.desc-wrap{position:relative;}
.desc-wrap .it-desc{width:100%;}
.item-suggest{display:none;position:absolute;top:calc(100% + 3px);right:0;left:0;background:var(--surface);border:1.5px solid var(--gold);border-radius:8px;box-shadow:0 8px 20px rgba(0,0,0,.15);z-index:15;max-height:180px;overflow-y:auto;}
.item-suggest.open{display:block;}
.sugg-item{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:12.5px;cursor:pointer;border-bottom:1px solid var(--line);}
.sugg-item:last-child{border-bottom:none;}
.sugg-item:hover{background:var(--surface-2);}
.sugg-item b{flex:1;}
.sugg-item .sugg-code{color:var(--text-mute);font-size:11px;}
.sugg-item .sugg-price{color:var(--gold-dark);font-weight:800;white-space:nowrap;}
.sugg-item .sugg-low{color:var(--danger);font-size:10.5px;white-space:nowrap;}
.item-row input{padding:8px 9px;font-size:13px;}
.remove-item-btn{background:transparent;border:none;color:var(--danger);font-size:19px;line-height:1;padding:0;}
.items-head{display:grid;grid-template-columns:1fr 54px 84px 26px;gap:7px;font-size:10.5px;color:var(--text-mute);font-weight:700;margin-bottom:6px;padding:0 2px;}
.invoice-total-box{display:flex;flex-direction:column;gap:4px;margin-top:10px;padding-top:12px;border-top:1.5px dashed var(--line);font-size:13px;}
.invoice-total-box .tot-line{display:flex;justify-content:space-between;}
.invoice-total-box .tot-final{font-weight:800;font-size:16.5px;margin-top:2px;}

/* customers */
.customer-card{background:var(--glass-bg);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);border:1px solid var(--glass-border);border-radius:var(--radius);padding:14px 16px;margin-bottom:9px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
.customer-card .cc-name{font-weight:800;font-size:14px;}
.customer-card .cc-phone{font-size:12px;color:var(--text-mute);margin-top:2px;}
.customer-card .cc-stats{display:flex;gap:18px;text-align:center;}
.customer-card .cc-stat b{display:block;font-size:15px;}
.customer-card .cc-stat span{font-size:10.5px;color:var(--text-mute);}

/* AI chat */
.ai-wrap{display:flex;flex-direction:column;height:calc(100dvh - 168px);background:var(--glass-bg);-webkit-backdrop-filter:blur(16px) saturate(180%);backdrop-filter:blur(16px) saturate(180%);border:1px solid var(--glass-border);border-radius:var(--radius);overflow:hidden;}
.ai-messages{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:11px;}
.msg{max-width:80%;padding:10px 14px;border-radius:13px;font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word;}
.msg.user{align-self:flex-start;background:var(--black);color:#fff;border-bottom-left-radius:4px;}
.msg.assistant{align-self:flex-end;background:var(--surface-2);color:var(--text);border-bottom-right-radius:4px;border:1px solid var(--line);}
.msg.loading{color:var(--text-mute);font-style:italic;}
.ai-quick{display:flex;gap:7px;flex-wrap:wrap;padding:0 16px 12px;}
.ai-quick button{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:11.5px;color:var(--text-mute);font-weight:600;}
.ai-quick button:hover{border-color:var(--gold);color:var(--text);}
.ai-input-row{display:flex;gap:9px;padding:13px;border-top:1px solid var(--line);align-items:flex-end;padding-bottom:calc(13px + var(--safe-b));}
.ai-input-row textarea{flex:1;resize:none;border:1.5px solid var(--line);border-radius:20px;padding:11px 16px;font-size:13.5px;max-height:100px;line-height:1.4;background:var(--surface);color:var(--text);}
.ai-input-row textarea:focus{outline:none;border-color:var(--gold);}
.ai-send{width:42px;height:42px;border-radius:50%;background:var(--gold);border:none;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ai-send:hover{background:var(--gold-light);}
.ai-send svg{width:17px;height:17px;color:var(--black);}
.ai-send:disabled{opacity:.5;}
.ai-key-missing{background:var(--surface-2);border:1px dashed var(--line);border-radius:10px;padding:14px;margin:14px 16px 0;font-size:12.5px;color:var(--text-mute);text-align:center;}
.ai-key-missing button{margin-top:8px;}

/* settings */
.settings-form{max-width:480px;}
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;}
.switch{position:relative;width:44px;height:24px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch .track{position:absolute;inset:0;background:var(--line);border-radius:24px;transition:background .2s;cursor:pointer;}
.switch .thumb{position:absolute;top:3px;right:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.switch input:checked + .track{background:var(--gold);}
.switch input:checked + .track .thumb{transform:translateX(-20px);}
.settings-status{font-size:11.5px;padding:3px 10px;border-radius:12px;font-weight:700;display:inline-flex;align-items:center;gap:5px;}
.settings-status.ok{background:#DFF1E2;color:#347a48;}
.settings-status.off{background:#F0EDE6;color:var(--text-mute);}

/* toast */
#toast{position:fixed;bottom:calc(24px + var(--safe-b));left:50%;transform:translateX(-50%) translateY(20px);background:var(--black);color:#fff;padding:11px 22px;border-radius:24px;font-size:13px;font-weight:700;opacity:0;transition:opacity .25s,transform .25s;z-index:90;pointer-events:none;max-width:90vw;text-align:center;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* print */
#printArea{display:none;}
.print-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #1F1F1F;padding-bottom:14px;margin-bottom:18px;}
.print-shop h2{margin:0;font-size:20px;}
.print-shop .gold{color:#a3822c;}
.print-shop .p-addr{font-size:11.5px;color:#555;margin-top:3px;}
.print-meta{text-align:left;font-size:12px;color:#333;line-height:1.7;}
.print-title{font-size:14px;font-weight:800;margin:14px 0 8px;}
.print-table{width:100%;border-collapse:collapse;margin-top:4px;}
.print-table th,.print-table td{border:1px solid #ccc;padding:8px 10px;font-size:12.5px;text-align:right;}
.print-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;font-size:12.5px;margin-bottom:10px;}
.print-info-grid b{font-weight:700;}
.print-total-box{text-align:left;font-size:14px;margin-top:14px;line-height:1.7;}
.print-total-box .grand{font-weight:800;font-size:16.5px;}
.print-foot{margin-top:34px;font-size:11px;color:#777;text-align:center;border-top:1px dashed #ccc;padding-top:10px;}
.thermal-receipt{width:100%;font-size:12px;line-height:1.55;color:#000;}
.thermal-receipt .t-center{text-align:center;}
.thermal-receipt .t-big{font-size:15px;font-weight:800;}
.thermal-receipt .t-sep{border-top:1px dashed #000;margin:7px 0;}
.thermal-receipt .t-row{display:flex;justify-content:space-between;gap:8px;}
.thermal-receipt .t-item-desc{font-weight:700;}
.thermal-receipt .t-item-sub{color:#333;font-size:11px;margin:2px 0 5px;}
.thermal-receipt .t-total{font-weight:800;font-size:13.5px;}

@media print{
  body *{display:none !important;}
  #printArea,#printArea *{display:revert !important;}
  #printArea{display:block !important;position:static;padding:10px;}
}

/* responsive */
@media (max-width:900px){
  .sidebar{position:fixed;top:auto;bottom:0;left:0;right:0;width:100%;height:auto;flex-direction:row;align-items:center;z-index:40;border-top:1px solid rgba(255,255,255,.1);padding-bottom:var(--safe-b);}
  .sidebar-logo,.sidebar-foot{display:none;}
  .nav{flex-direction:row;align-items:center;justify-content:space-around;padding:6px 4px;overflow-x:auto;gap:0;height:auto;}
  .nav-item{width:auto;flex-direction:column;gap:3px;font-size:9.5px;padding:7px 5px;text-align:center;white-space:nowrap;border-radius:10px;flex-shrink:0;flex-grow:0;min-width:52px;align-self:auto;}
  .nav-item svg{width:19px;height:19px;}
  .topbar-mobile-logo{display:flex;}
  .main{padding-bottom:0;}
  .topbar{padding:14px 16px;}
  .view{padding:16px 14px calc(86px + var(--safe-b));}
  .stats-row{grid-template-columns:repeat(2,1fr);}
  .dash-grid{grid-template-columns:1fr;}
  .field-row,.field-row3{grid-template-columns:1fr;}
  .ai-wrap{height:calc(100dvh - 235px);}
  table{font-size:12px;}
  th,td{padding:9px 8px;}
  .modal{padding:18px;}
}
@media (min-width:901px){
  .topbar-date{display:block;}
}
@media (prefers-reduced-motion: reduce){
  *{transition:none !important;animation:none !important;}
}
:focus-visible{outline:2.5px solid var(--gold);outline-offset:1px;}

const EXPENSE_CATEGORIES = ['بضاعة ومنتجات','مستلزمات المحل','فواتير وخدمات','أخرى'];
const PAYMENT_METHODS = ['نقدي','شام كاش','أخرى'];
const CURRENCIES = [
  {code:'USD', symbol:'$', label:'دولار أمريكي'},
  {code:'SYP', symbol:'ل.س', label:'ليرة سورية'},
  {code:'TRY', symbol:'₺', label:'ليرة تركية'},
  {code:'CUSTOM', symbol:'', label:'مخصص'}
];
const FIREBASE_SDK_VER = '12.8.0';

/* ==========================================================================
   FIREBASE — مشروع واحد يخدم كل المحلات (multi-tenant)، والفصل بين المحلات
   يتم عبر "رمز المحل" (Shop ID) + قواعد أمان Firestore (انظر firestore.rules).
   عبّئ بيانات مشروعك من Firebase Console → Project settings → Web app.
   هذه القيم ليست سرّية (بيانات إعداد العميل في Firebase مصممة لتكون علنية)،
   الحماية الحقيقية تأتي من Security Rules وليس من إخفاء هذا الكائن.
   ========================================================================== */
const EMBEDDED_FIREBASE_CONFIG = {
  apiKey: "PUT-YOUR-API-KEY-HERE",
  authDomain: "PUT-YOUR-PROJECT.firebaseapp.com",
  projectId: "PUT-YOUR-PROJECT-ID",
  storageBucket: "PUT-YOUR-PROJECT.appspot.com",
  messagingSenderId: "PUT-YOUR-SENDER-ID",
  appId: "PUT-YOUR-APP-ID"
};
const AUTH_EMAIL_DOMAIN = 'tmapp.local'; // بريد اصطناعي داخلي فقط لاستخدام Firebase Auth، لا علاقة له ببريد حقيقي
function isFirebaseConfigured(){
  return !!(EMBEDDED_FIREBASE_CONFIG && EMBEDDED_FIREBASE_CONFIG.apiKey && EMBEDDED_FIREBASE_CONFIG.apiKey.indexOf('PUT-YOUR')!==0);
}
function slugifyForAuth(s){
  return String(s||'').trim().toLowerCase().replace(/[^a-z0-9_.-]/g,'');
}
function syntheticEmail(username, shopId){
  return slugifyForAuth(username) + '__' + slugifyForAuth(shopId) + '@' + AUTH_EMAIL_DOMAIN;
}
function newDeviceId(){
  const arr = new Uint8Array(20);
  crypto.getRandomValues(arr);
  return 'dev_' + Array.from(arr).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
}
function detectDeviceLabel(){
  const ua = navigator.userAgent || '';
  let os = 'جهاز غير معروف';
  if(/iPhone/.test(ua)) os = 'iPhone';
  else if(/iPad/.test(ua)) os = 'iPad';
  else if(/Android/.test(ua)) os = 'Android';
  else if(/Macintosh/.test(ua)) os = 'Mac';
  else if(/Windows/.test(ua)) os = 'Windows';
  let browser = '';
  if(/CriOS/.test(ua)) browser = 'Chrome';
  else if(/Safari/.test(ua) && /iPhone|iPad|Macintosh/.test(ua)) browser = 'Safari';
  else if(/Edg\//.test(ua)) browser = 'Edge';
  else if(/Chrome/.test(ua)) browser = 'Chrome';
  else if(/Firefox/.test(ua)) browser = 'Firefox';
  return os + (browser?(' — '+browser):'');
}

function esc(s){
  return String(s===null||s===undefined?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function fmt(n){
  n = Number(n||0);
  return n.toLocaleString('en-US', {maximumFractionDigits:2, minimumFractionDigits:0});
}
function currentCurrencySymbol(){
  if(state.shopInfo.currencyCode==='CUSTOM') return state.shopInfo.customCurrencySymbol || '';
  const c = CURRENCIES.find(function(x){ return x.code===state.shopInfo.currencyCode; });
  return c ? c.symbol : '$';
}
function money(n){ return fmt(n) + ' ' + currentCurrencySymbol(); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDateAr(iso){
  if(!iso) return '—';
  try{ return new Date(iso).toLocaleDateString('ar-EG', {year:'numeric', month:'short', day:'numeric'}); }
  catch(e){ return iso; }
}
function sameMonth(iso, ref){
  if(!iso) return false;
  const d = new Date(iso);
  if(isNaN(d.getTime())) return false;
  return d.getFullYear()===ref.getFullYear() && d.getMonth()===ref.getMonth();
}
function sameDay(iso, ref){
  if(!iso) return false;
  const d = new Date(iso);
  if(isNaN(d.getTime())) return false;
  return d.getFullYear()===ref.getFullYear() && d.getMonth()===ref.getMonth() && d.getDate()===ref.getDate();
}
function genId(prefix){ return prefix + Date.now().toString(36) + Math.floor(Math.random()*1000); }
function shortCode(prefix){
  const d = new Date();
  const ymd = String(d.getFullYear()).slice(2) + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
  const rand = Math.random().toString(36).slice(2,5).toUpperCase();
  return prefix+ymd+'-'+rand;
}

function normalizePhoneForWhatsapp(phone){
  let p = (phone||'').replace(/[^0-9+]/g,'');
  if(p.indexOf('+')===0) p = p.slice(1);
  else if(p.indexOf('00')===0) p = p.slice(2);
  else if(p.indexOf('0')===0) p = (state.shopInfo.whatsappCountryCode||'963') + p.slice(1);
  return p;
}
async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
}
function randomSalt(){
  const arr = new Uint8Array(16);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
}
async function hashPassword(password, salt){
  return await sha256Hex(salt + ':' + password);
}
async function verifyPassword(password, salt, hash){
  const h = await hashPassword(password, salt);
  return h === hash;
}

function resizeImageFile(file, maxSize, quality, callback){
  const reader = new FileReader();
  reader.onload = function(e){
    const img = new Image();
    img.onload = function(){
      let w = img.width, h = img.height;
      if(w > h){ if(w > maxSize){ h = Math.round(h * maxSize/w); w = maxSize; } }
      else { if(h > maxSize){ w = Math.round(w * maxSize/h); h = maxSize; } }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', quality||0.72));
    };
    img.onerror = function(){ callback(null); };
    img.src = e.target.result;
  };
  reader.onerror = function(){ callback(null); };
  reader.readAsDataURL(file);
}

}

/* =====================================================================
   Firebase — طبقة الاتصال (Authentication + Firestore)
   Firebase هو المصدر الوحيد للبيانات المهمة؛ لا يوجد "وضع محلي بديل".
   يبقى التطبيق يعمل مؤقتاً بدون إنترنت بفضل التخزين المؤقت (offline
   persistence) المدمج في Firestore، ويتزامن تلقائياً عند رجوع الاتصال.
   ===================================================================== */
function isCloud(){ return !!(fsRefs && fsRefs.db && state.cloudConnected); }
function shopPath(sub){ return 'shops/'+state.cloud.shopId+'/'+sub; }
const FIRESTORE_KIND_MAP = { users: 'staff' }; /* state.users في الذاكرة يقابل مجموعة staff في Firestore */
function collectionPathFor(kind){ return shopPath(FIRESTORE_KIND_MAP[kind] || kind); }
const SHIFT_TAGGED_KINDS = ['repairs','invoices','expenses'];

async function connectFirebaseApp(){
  if(!isFirebaseConfigured()) return false;
  if(fsRefs) return true;
  try{
    const appMod = await import('https://www.gstatic.com/firebasejs/'+FIREBASE_SDK_VER+'/firebase-app.js');
    const fsMod = await import('https://www.gstatic.com/firebasejs/'+FIREBASE_SDK_VER+'/firebase-firestore.js');
    const authMod = await import('https://www.gstatic.com/firebasejs/'+FIREBASE_SDK_VER+'/firebase-auth.js');
    const app = appMod.initializeApp(EMBEDDED_FIREBASE_CONFIG);
    const dbInst = fsMod.getFirestore(app);
    try{ await fsMod.enableIndexedDbPersistence(dbInst); }
    catch(e){ console.warn('Firestore offline persistence غير متاحة على هذا المتصفح', e); }
    const authInst = authMod.getAuth(app);
    try{ await authMod.setPersistence(authInst, authMod.browserLocalPersistence); }catch(e){}
    fsRefs = {
      app: app, db: dbInst, auth: authInst,
      collection: fsMod.collection, doc: fsMod.doc, setDoc: fsMod.setDoc, deleteDoc: fsMod.deleteDoc,
      query: fsMod.query, where: fsMod.where, orderBy: fsMod.orderBy,
      onSnapshot: fsMod.onSnapshot, getDocs: fsMod.getDocs, getDoc: fsMod.getDoc,
      signInWithEmailAndPassword: authMod.signInWithEmailAndPassword,
      createUserWithEmailAndPassword: authMod.createUserWithEmailAndPassword,
      updatePassword: authMod.updatePassword,
      signOut: authMod.signOut,
      onAuthStateChanged: authMod.onAuthStateChanged,
      initializeApp: appMod.initializeApp, deleteApp: appMod.deleteApp, getAuthFn: authMod.getAuth
    };
    return true;
  }catch(e){
    console.error('Firebase init failed', e);
    fsRefs = null;
    return false;
  }
}

/* تسجيل موظف جديد في Firebase Auth دون قطع جلسة المدير الحالي: يستخدم
   تطبيق Firebase ثانوي مؤقت (الطريقة التي توصي بها توثيقات Firebase). */
async function createStaffAuthAccount(email, password){
  const secondaryApp = fsRefs.initializeApp(EMBEDDED_FIREBASE_CONFIG, 'secondary-'+Date.now());
  const secondaryAuth = fsRefs.getAuthFn(secondaryApp);
  try{
    const cred = await fsRefs.createUserWithEmailAndPassword(secondaryAuth, email, password);
    const uid = cred.user.uid;
    try{ await fsRefs.signOut(secondaryAuth); }catch(e){}
    try{ await fsRefs.deleteApp(secondaryApp); }catch(e){}
    return uid;
  }catch(e){
    try{ await fsRefs.deleteApp(secondaryApp); }catch(e2){}
    throw e;
  }
}

function subscribeCloudCollections(){
  const pairs = ['repairs','invoices','expenses','inventory','products','users'];
  pairs.forEach(function(kind){
    const colRef = fsRefs.collection(fsRefs.db, collectionPathFor(kind));
    const unsub = fsRefs.onSnapshot(colRef, function(snap){
      const arr = [];
      snap.forEach(function(d){ arr.push(Object.assign({id:d.id}, d.data())); });
      state[kind] = arr;
      rerenderCurrentView();
      if(kind==='users' && document.getElementById('usersListWrap')) refreshUsersList();
    }, function(err){ console.error('snapshot error', kind, err); });
    unsubscribers.push(unsub);
  });
  const infoRef = fsRefs.doc(fsRefs.db, shopPath('meta'), 'shopInfo');
  const unsub2 = fsRefs.onSnapshot(infoRef, function(snap){
    if(snap.exists()){
      state.shopInfo = Object.assign({}, state.shopInfo, snap.data());
      rerenderCurrentView();
    }
  }, function(err){ console.error('shopInfo snapshot error', err); });
  unsubscribers.push(unsub2);
  const shopRef = fsRefs.doc(fsRefs.db, 'shops', state.cloud.shopId);
  const unsub3 = fsRefs.onSnapshot(shopRef, function(snap){
    if(snap.exists()) state.shopMeta = Object.assign({}, state.shopMeta, snap.data());
  }, function(err){ console.error('shopMeta snapshot error', err); });
  unsubscribers.push(unsub3);
}

async function logAudit(action, kind, recordId, details){
  if(!isCloud()) return;
  try{
    const entry = {
      id: genId('log_'), action: action, kind: kind, recordId: recordId || null,
      actorId: (state.currentUser && state.currentUser.id) || null,
      actorName: (state.currentUser && state.currentUser.displayName) || null,
      deviceId: state.cloud.deviceId || null,
      shift: state.currentShift || null,
      at: Date.now(), details: details || null
    };
    await fsRefs.setDoc(fsRefs.doc(fsRefs.db, shopPath('auditLog'), entry.id), entry);
  }catch(e){ console.warn('audit log write failed', e); }
}
async function fetchAuditLog(limitCount){
  if(!isCloud()) return [];
  try{
    const colRef = fsRefs.collection(fsRefs.db, shopPath('auditLog'));
    const snap = await fsRefs.getDocs(colRef);
    const arr = [];
    snap.forEach(function(d){ arr.push(d.data()); });
    arr.sort(function(a,b){ return (b.at||0)-(a.at||0); });
    return arr.slice(0, limitCount||200);
  }catch(e){ console.error('fetchAuditLog failed', e); return []; }
}

/* إشعارات داخل التطبيق (foreground) — لحظة فتح التطبيق فقط.
   لإشعارات فعلية تصل للهاتف والتطبيق مغلق، يلزم Cloud Functions + FCM (راجع SETUP.md). */
let notificationsSubscribedAt = 0;
async function sendNotification(message){
  if(!isCloud()) return;
  try{
    const doc = { id: genId('ntf_'), message: message, at: Date.now(), fromDeviceId: state.cloud.deviceId||null, fromUid: state.currentUser?state.currentUser.id:null };
    await fsRefs.setDoc(fsRefs.doc(fsRefs.db, shopPath('notifications'), doc.id), doc);
  }catch(e){ console.warn('notification send failed', e); }
}
function subscribeNotifications(){
  if(!isCloud()) return;
  notificationsSubscribedAt = Date.now();
  try{
    const colRef = fsRefs.collection(fsRefs.db, shopPath('notifications'));
    const unsub = fsRefs.onSnapshot(colRef, function(snap){
      snap.docChanges().forEach(function(ch){
        if(ch.type==='added'){
          const d = ch.doc.data();
          if(d.at && d.at>=notificationsSubscribedAt && d.fromDeviceId!==state.cloud.deviceId){
            showToast('🔔 '+d.message);
            showBrowserNotification((state.shopInfo&&state.shopInfo.name)||'TM Mobile', d.message);
          }
        }
      });
    }, function(err){ console.warn('notifications snapshot error', err); });
    unsubscribers.push(unsub);
  }catch(e){ console.warn(e); }
}
function showBrowserNotification(title, body){
  try{
    if(!('Notification' in window)) return;
    if(Notification.permission==='granted'){
      new Notification(title, {body: body, icon:'icons/icon-192.png'});
    } else if(Notification.permission!=='denied'){
      Notification.requestPermission().then(function(p){
        if(p==='granted') new Notification(title, {body: body, icon:'icons/icon-192.png'});
      });
    }
  }catch(e){ /* Notification API غير متاح (بعض أوضاع iOS Safari) — نعتمد فقط على toast داخل الصفحة */ }
}

async function persistRecord(kind, record){
  const existedBefore = (state[kind]||[]).some(function(x){ return x.id===record.id; });
  if(SHIFT_TAGGED_KINDS.indexOf(kind)>-1 && !record._stamped){

    record.shift = state.currentShift || null;
    record.shiftDate = state.shiftDate || todayISO();
    record._stamped = true;
  }
  try{
    const ref = fsRefs.doc(fsRefs.db, collectionPathFor(kind), record.id);
    await fsRefs.setDoc(ref, record);
    logAudit(existedBefore ? 'تعديل' : 'إضافة', kind, record.id);
  }catch(e){ console.error(e); showToast('تعذّر الحفظ — تحقّق من اتصالك بالإنترنت'); }
}

/* ---------------- WebAuthn (device-bound biometric convenience login) ---------------- */
function webauthnSupported(){
  return !!(window.PublicKeyCredential && navigator.credentials && window.isSecureContext);
}
function hasBiometricForUser(uid){ return !!localStorage.getItem('tm_webauthn_'+uid); }
function bufToBase64(buf){ return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }
function base64ToBuf(b64){
  const bin = atob(b64);
  const buf = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) buf[i] = bin.charCodeAt(i);
  return buf;
}
async function updateTrustedDeviceFields(extra){
  if(!isCloud() || !state.currentUser) return;
  try{
    const ref = fsRefs.doc(fsRefs.db, shopPath('trustedDevices'), state.cloud.deviceId);
    const snap = await fsRefs.getDoc(ref);
    const base = snap.exists() ? snap.data() : {
      deviceId: state.cloud.deviceId, uid: state.currentUser.id, username: state.currentUser.username,
      displayName: state.currentUser.displayName, deviceLabel: detectDeviceLabel(),
      createdAt: Date.now(), revoked: false, quickMethod: null
    };
    Object.assign(base, extra||{}, {
      uid: state.currentUser.id, username: state.currentUser.username,
      displayName: state.currentUser.displayName, lastUsedAt: Date.now()
    });
    await fsRefs.setDoc(ref, base);
  }catch(e){ console.warn('trusted device update failed', e); }
}
async function registerBiometricForUser(uid){
  if(!webauthnSupported()){ showToast('البصمة تحتاج فتح الموقع عبر https (غير متاحة كملف محلي)'); return; }
  try{
    const challenge = new Uint8Array(32);
    crypto.getRandomValues(challenge);
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge: challenge,
        rp: { name: (state.shopInfo && state.shopInfo.name) || 'TM Mobile' },
        user: { id: new TextEncoder().encode(uid), name: uid, displayName: (state.currentUser&&state.currentUser.displayName)||uid },
        pubKeyCredParams: [{alg:-7, type:'public-key'}, {alg:-257, type:'public-key'}],
        authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required' },
        timeout: 60000
      }
    });
    if(cred){
      const credIdB64 = bufToBase64(cred.rawId);
      localStorage.setItem('tm_webauthn_'+uid, credIdB64);
      await updateTrustedDeviceFields({ quickMethod:'passkey', webauthnCredentialId: credIdB64 });
      showToast('تم تفعيل البصمة لهذا الحساب على هذا الجهاز');
      if(document.getElementById('modalOverlay')) openAccountModal();
    }
  }catch(e){
    console.error(e);
    showToast('تعذّر تفعيل البصمة على هذا الجهاز');
  }
}
async function loginWithBiometric(){
  const uid = state.currentUser && state.currentUser.id;
  if(!uid || !hasBiometricForUser(uid)){ showToast('لم تُفعَّل البصمة لهذا الحساب على هذا الجهاز'); return; }
  if(!webauthnSupported()){ showToast('البصمة تحتاج فتح الموقع عبر https'); return; }
  try{
    const challenge = new Uint8Array(32);
    crypto.getRandomValues(challenge);
    const credId = localStorage.getItem('tm_webauthn_'+uid);
    const assertion = await navigator.credentials.get({
      publicKey: { challenge: challenge, allowCredentials: [{ id: base64ToBuf(credId), type:'public-key' }], userVerification:'required', timeout:60000 }
    });
    if(!assertion) throw new Error('no assertion');
    await onDeviceUnlockSuccess();
  }catch(e){
    console.error(e);
    showToast('تعذّر تسجيل الدخول بالبصمة');
  }
}
function disableBiometric(uid){
  try{ localStorage.removeItem('tm_webauthn_'+uid); }catch(e){}
  updateTrustedDeviceFields({ quickMethod:null, webauthnCredentialId:null });

  closeModal();
}

function onAccountPhotoChange(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  resizeImageFile(file, 220, 0.72, function(dataUrl){
    if(!dataUrl){ showToast('تعذّر معالجة الصورة'); return; }
    window.__pendingPhoto = dataUrl;
    showToast('تم اختيار الصورة — اضغط "حفظ التغييرات"');
  });
}
async function saveAccountChanges(){
  const u = state.currentUser;
  const newName = document.getElementById('acc_displayName').value.trim();
  const newPass = document.getElementById('acc_newpass').value;
  const newQuickLock = document.getElementById('acc_quicklock').value;
  if(!newName){ showToast('الاسم لا يمكن أن يكون فارغاً'); return; }
  u.displayName = newName;
  if(window.__pendingPhoto){ u.photo = window.__pendingPhoto; window.__pendingPhoto = null; }
  if(newPass){
    if(newPass.length<6){ showToast('كلمة المرور يجب أن تكون 6 خانات على الأقل'); return; }
    try{
      await fsRefs.updatePassword(fsRefs.auth.currentUser, newPass);
    }catch(e){
      console.error(e);
      showToast(e && e.code==='auth/requires-recent-login' ? 'لأمانك، سجّل الخروج ثم الدخول مجدداً قبل تغيير كلمة المرور' : 'تعذّر تغيير كلمة المرور');
      return;
    }
  }
  if(newQuickLock){
    if(newQuickLock.length<4){ showToast('كلمة السر السريعة قصيرة جداً (4 على الأقل)'); return; }
    await setQuickLock(u.id, newQuickLock);
  }
  await persistRecord('users', u);
  await syncPublicStaffDoc(u.id, u.username, u.displayName);
  closeModal();
  renderAccountButton();
  showToast('تم حفظ التغييرات');
}

/* ---------------- nav & view switching (role-aware) ---------------- */
function buildNav(){
  const user = state.currentUser;
  const isAdmin = !!(user && user.role==='admin');
  const items = [
    ['dashboard','dashboard','لوحة التحكم', null],
    ['repairs','wrench','الصيانة', null],
    ['invoices','receipt','الفواتير', null],
    ['expenses','coin','المصاريف', 'expenses'],
    ['inventory','box','المخزون', null],
    ['customers','users','العملاء', null],
    ['shifts','clock','الشفتات', 'adminOnly'],
    ['devices','lock','الأجهزة الموثوقة', 'adminOnly'],
    ['auditlog','receiptSm','سجل العمليات', 'adminOnly'],
    ['ai','sparkle','المساعد الذكي', null],
    ['settings','gear','الإعدادات', 'settings']
  ];
  const visible = items.filter(function(it){
    if(it[3]==='adminOnly') return isAdmin;
    return !it[3] || userCan(user, it[3]);
  });
  document.getElementById('navList').innerHTML = visible.map(function(it){
    return '<button class="nav-item" data-view="'+it[0]+'" onclick="switchView(\''+it[0]+'\')">'+ICONS[it[1]]+'<span>'+it[2]+'</span></button>';
  }).join('');
}
function updateTopbarDate(){
  const d = new Date();
  const el = document.getElementById('topbarDate');
  if(el) el.textContent = d.toLocaleDateString('ar-EG', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
}
function switchView(v){
  const user = state.currentUser;
  const isAdmin = !!(user && user.role==='admin');
  if(v==='settings' && !userCan(user,'settings')) v = 'dashboard';
  if(v==='expenses' && !userCan(user,'expenses')) v = 'dashboard';
  if((v==='shifts'||v==='devices'||v==='auditlog') && !isAdmin) v = 'dashboard';
  state.view = v;
  document.querySelectorAll('.view').forEach(function(el){ el.classList.remove('active'); });
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(function(el){ el.classList.toggle('active', el.dataset.view===v); });
  document.getElementById('pageTitle').textContent = VIEW_TITLES[v].title;
  document.getElementById('pageSub').textContent = VIEW_TITLES[v].sub;
  if(v==='dashboard') renderDashboard();
  else if(v==='repairs') renderRepairs();
  else if(v==='invoices') renderInvoices();
  else if(v==='expenses') renderExpenses();
  else if(v==='inventory') renderInventory();
  else if(v==='customers') renderCustomers();
  else if(v==='shifts') renderShifts();
  else if(v==='devices') renderDevices();
  else if(v==='auditlog') renderAuditLog();
  else if(v==='ai') renderAI();
  else if(v==='settings') renderSettings();
  window.scrollTo(0,0);
}

/* ---------------- boot sequence ---------------- */
async function init(){
  updateTopbarDate();
  renderLogos();
  loadDeviceSettings();
  applyTheme();
  if(!isFirebaseConfigured()){
    document.getElementById('loadingScreen').style.display = 'none';
    showFirebaseNotConfiguredScreen();
    return;
  }
  const ok = await connectFirebaseApp();
  document.getElementById('loadingScreen').style.display = 'none';
  if(!ok){
    showConnectionErrorScreen();
    return;
  }
  state.cloudConnected = true;
  const fbUser = await new Promise(function(resolve){
    const unsub = fsRefs.onAuthStateChanged(fsRefs.auth, function(u){ unsub(); resolve(u); });
  });
  if(fbUser && state.cloud.shopId){
    await resumeSession(fbUser);
  } else {
    resetLoginFlow();
    showLoginScreen();
  }
}
async function resumeSession(fbUser){
  try{
    const staffSnap = await fsRefs.getDoc(fsRefs.doc(fsRefs.db, shopPath('staff'), fbUser.uid));
    if(!staffSnap.exists() || staffSnap.data().disabled){
      showToast('هذا الحساب غير مُفعَّل أو تم حذفه — تواصل مع المدير');
      doFullLogout();
      return;
    }
    state.currentUser = Object.assign({id: fbUser.uid}, staffSnap.data());
    unsubscribeAllCloud();
    subscribeCloudCollections();
    subscribeNotifications();
    const stillTrusted = await checkTrustedDeviceStillValid();
    if(!stillTrusted){
      showToast('تم إلغاء تسجيل هذا الجهاز من طرف المدير — سجّل الدخول من جديد');
      doFullLogout();
      return;
    }
    if(getQuickLockData(state.currentUser.id) || hasBiometricForUser(state.currentUser.id)){
      showQuickLockScreen(state.currentUser);
    } else {
      await onDeviceUnlockSuccess();
    }
  }catch(e){
    console.error('resumeSession failed', e);
    showLoginScreen();
  }
}
async function checkTrustedDeviceStillValid(){
  if(!state.cloud.deviceId) return true;
  try{
    const ref = fsRefs.doc(fsRefs.db, shopPath('trustedDevices'), state.cloud.deviceId);
    const snap = await fsRefs.getDoc(ref);
    if(!snap.exists()) return true;
    if(snap.data().revoked) return false;
    fsRefs.setDoc(ref, Object.assign({}, snap.data(), {lastUsedAt: Date.now()})).catch(function(){});
    return true;
  }catch(e){ return true; }
}

/* ================= DASHBOARD ================= */
function renderDashboard(){
  const now = new Date();
  const pending = state.repairs.filter(function(r){ return r.status==='قيد الصيانة'; });
  const waitingPart = state.repairs.filter(function(r){ return r.status==='بانتظار قطعة'; });
  const ready = state.repairs.filter(function(r){ return r.status==='تم الإصلاح - جاهز للتسليم'; });
  const unpaidInvoices = state.invoices.filter(function(i){ return i.status==='غير مدفوعة'; });
  const unpaidTotal = unpaidInvoices.reduce(function(s,i){ return s+Number(i.total||0); }, 0);

  const todayRevenue = state.invoices.filter(function(i){ return i.status==='مدفوعة' && sameDay(i.date, now); }).reduce(function(s,i){ return s+Number(i.total||0); }, 0);
  const todayExpenses = state.expenses.filter(function(e){ return sameDay(e.date, now); }).reduce(function(s,e){ return s+Number(e.amount||0); }, 0);
  const todayProfit = todayRevenue - todayExpenses;

  const monthRevenue = state.invoices.filter(function(i){ return i.status==='مدفوعة' && sameMonth(i.date, now); }).reduce(function(s,i){ return s+Number(i.total||0); }, 0);
  const monthExpenses = state.expenses.filter(function(e){ return sameMonth(e.date, now); }).reduce(function(s,e){ return s+Number(e.amount||0); }, 0);
  const monthProfit = monthRevenue - monthExpenses;

  const recentRepairs = state.repairs.slice().sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); }).slice(0,5);
  const recentInvoices = state.invoices.slice().sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); }).slice(0,5);

  let html = '';
  html += '<div class="stats-row">';
  html += statCard('warn','clock','قيد الصيانة الآن', (pending.length+waitingPart.length));
  html += statCard('good','check','جاهزة للتسليم', ready.length);
  html += statCard('','coin','فواتير غير مدفوعة', unpaidInvoices.length+' — '+money(unpaidTotal));
  html += statCard('cash','coin','أرباح اليوم', money(todayProfit));
  html += statCard('cash','coin','أرباح هذا الشهر', money(monthProfit));
  html += '</div>';
  html += '<p class="hint" style="margin:-12px 0 18px;">الأرباح = الفواتير المدفوعة − المصاريف المسجّلة لنفس الفترة</p>';

  html += '<div class="dash-grid">';
  html += '<div class="panel"><h3>أحدث تذاكر الصيانة</h3>';
  if(recentRepairs.length===0){
    html += '<div style="padding:14px 0;color:var(--text-mute);font-size:13px;">لا توجد تذاكر صيانة بعد.</div>';
  } else {
    html += recentRepairs.map(function(r){
      return '<div class="mini-row"><div><div class="mr-main">'+esc(r.customerName)+' — '+esc(r.deviceType)+'</div><div class="mr-sub">'+esc(r.ticketNo)+' · '+esc((r.issue||'').slice(0,40))+'</div></div><span class="pill '+statusPillClass(r.status)+'">'+esc(r.status)+'</span></div>';
    }).join('');
  }
  html += '<div style="padding:12px 0;"><button class="btn btn-outline btn-sm" onclick="switchView(\'repairs\')">عرض كل التذاكر</button></div>';
  html += '</div>';

  html += '<div class="panel"><h3>أحدث الفواتير</h3>';
  if(recentInvoices.length===0){
    html += '<div style="padding:14px 0;color:var(--text-mute);font-size:13px;">لا توجد فواتير بعد.</div>';
  } else {
    html += recentInvoices.map(function(i){
      return '<div class="mini-row"><div><div class="mr-main">'+esc(i.customerName||'زبون نقدي')+'</div><div class="mr-sub">'+esc(i.invoiceNo)+' · '+fmtDateAr(i.date)+'</div></div><div style="text-align:left;"><div class="mr-main">'+money(i.total)+'</div><span class="pill '+(i.status==='مدفوعة'?'paid':'unpaid')+'">'+esc(i.status)+'</span></div></div>';
    }).join('');
  }
  html += '<div style="padding:12px 0;"><button class="btn btn-outline btn-sm" onclick="switchView(\'invoices\')">عرض كل الفواتير</button></div>';
  html += '</div>';
  html += '</div>';

  document.getElementById('view-dashboard').innerHTML = html;
}
function statCard(cls, icon, label, num){

/* ================= REPAIRS ================= */
function renderRepairs(){
  const filters = ['الكل'].concat(REPAIR_STATUSES);
  let list = state.repairs.slice().sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
  if(state.repairFilter!=='الكل') list = list.filter(function(r){ return r.status===state.repairFilter; });
  if(state.repairSearch){
    const q = state.repairSearch.trim().toLowerCase();
    list = list.filter(function(r){
      return (r.customerName||'').toLowerCase().indexOf(q)>-1 ||
             (r.phone||'').toLowerCase().indexOf(q)>-1 ||
             (r.deviceType||'').toLowerCase().indexOf(q)>-1 ||
             (r.deviceModel||'').toLowerCase().indexOf(q)>-1 ||
             (r.ticketNo||'').toLowerCase().indexOf(q)>-1;
    });
  }

  let html = '<div class="section-head"><h2>سجل أجهزة الصيانة</h2><button class="btn btn-gold" onclick="openRepairForm()">'+ICONS.plus+'جهاز جديد</button></div>';
  html += '<div class="toolbar">';
  html += filters.map(function(f){
    return '<button class="chip '+(state.repairFilter===f?'active':'')+'" onclick="setRepairFilter(\''+f+'\')">'+f+'</button>';
  }).join('');
  html += '<div class="search-wrap">'+ICONS.search+'<input class="search-input" placeholder="بحث بالاسم، الهاتف أو رقم التذكرة" value="'+esc(state.repairSearch)+'" oninput="setRepairSearch(this.value)"></div>';
  html += '</div>';

  if(list.length===0){
    html += emptyState('box','لا توجد نتائج', state.repairs.length===0 ? 'لم تُضف أي أجهزة للصيانة بعد.' : 'لا توجد تذاكر مطابقة للفلتر الحالي.', state.repairs.length===0 ? '<button class="btn btn-gold" onclick="openRepairForm()">'+ICONS.plus+'إضافة أول جهاز</button>' : '');
  } else {
    html += '<div class="table-wrap"><table><thead><tr><th>التذكرة</th><th>الزبون</th><th>الجهاز</th><th>العطل</th><th>الاستلام</th><th>التكلفة</th><th>الحالة</th><th></th></tr></thead><tbody>';
    html += list.map(repairRow).join('');
    html += '</tbody></table></div>';
  }
  document.getElementById('view-repairs').innerHTML = html;

async function updateRepairStatus(id, newStatus){
  const r = state.repairs.find(function(x){ return x.id===id; });
  if(!r) return;
  r.status = newStatus;
  if(newStatus==='تم التسليم' && !r.deliveredDate) r.deliveredDate = todayISO();
  await persistRecord('repairs', r);
  if(!isCloud()) renderRepairs();
  showToast('تم تحديث حالة التذكرة');
}

/* ---- status change handling: WhatsApp prompt + delivery/payment flow ---- */
function handleStatusChange(selectEl, id){
  const r = state.repairs.find(function(x){ return x.id===id; });
  if(!r) return;
  const newStatus = selectEl.value;
  if(newStatus === r.status) return;
  if(newStatus === 'تم التسليم'){
    openDeliverPaymentModal(id, selectEl);
    return;
  }
  updateRepairStatus(id, newStatus).then(function(){
    if(r.phone && confirm('تم تحديث الحالة إلى "'+newStatus+'". إرسال إشعار واتساب للزبون الآن؟')){
      sendStatusWhatsApp(id, newStatus);
    }
  });
}
function statusWhatsAppMessage(r, status){
  const deviceLabel = r.deviceType + (r.deviceModel ? (' '+r.deviceModel) : '');
  const shop = state.shopInfo.name;
  if(status==='قيد الصيانة') return 'مرحباً '+r.customerName+'، بدأنا العمل على صيانة جهازك ('+deviceLabel+') في '+shop+'. سنعلمك فور الانتهاء ✅\nرقم التذكرة: '+r.ticketNo;
  if(status==='بانتظار قطعة') return 'مرحباً '+r.customerName+'، جهازك ('+deviceLabel+') بانتظار توفر قطعة غيار لإكمال الإصلاح، سنعلمك فور وصولها ومتابعة العمل.\nرقم التذكرة: '+r.ticketNo;
  if(status==='تم الإصلاح - جاهز للتسليم') return 'مرحباً '+r.customerName+'، جهازك ('+deviceLabel+') جاهز للاستلام الآن ✅ في '+shop+'.\nرقم التذكرة: '+r.ticketNo;
  if(status==='تم التسليم') return 'شكراً لثقتك بـ '+shop+' 🙏 تم تسليم جهازك ('+deviceLabel+') بنجاح.\nرقم التذكرة: '+r.ticketNo;
  if(status==='تم الاعتذار عن الصيانة') return 'مرحباً '+r.customerName+'، نأسف لإخبارك أنه تعذّر علينا إصلاح جهازك ('+deviceLabel+') في '+shop+'. يرجى التواصل معنا بخصوص استلام الجهاز.\nرقم التذكرة: '+r.ticketNo;
  if(status==='ملغاة') return 'مرحباً '+r.customerName+'، تم إلغاء طلب صيانة جهازك ('+deviceLabel+') بناءً على طلبكم.\nرقم التذكرة: '+r.ticketNo;
  return 'مرحباً '+r.customerName+'، بخصوص جهازك رقم '+r.ticketNo+' في '+shop+'.';
}
function sendStatusWhatsApp(repairId, status){
  const r = state.repairs.find(function(x){ return x.id===repairId; });
  if(!r || !r.phone){ showToast('لا يوجد رقم هاتف لهذا الزبون'); return; }
  const msg = statusWhatsAppMessage(r, status);
  const num = normalizePhoneForWhatsapp(r.phone);
  window.open('https://wa.me/'+num+'?text='+encodeURIComponent(msg), '_blank');
}

function openDeliverPaymentModal(id, selectEl){

  const html = ''+

  '<div class="modal-actions"><button class="btn btn-outline" onclick="cancelDeliverModal()">إلغاء</button><button class="btn btn-gold" onclick="confirmDeliverPayment()">'+ICONS.check+'تأكيد التسليم والدفع</button></div>';
  openModal(html);
  recalcDeliverTotal(cost);
}
function recalcDeliverTotal(cost){
  const discEl = document.getElementById('dm_discount');
  const discount = Number((discEl && discEl.value) || 0);
  const discounted = cost * (1 - discount/100);
  const box = document.getElementById('dm_total_box');
  if(box){
    box.innerHTML = '<div class="tot-line"><span>التكلفة الأصلية</span><span>'+money(cost)+'</span></div>'+
      (discount ? '<div class="tot-line"><span>بعد خصم '+discount+'%</span><span>'+money(discounted)+'</span></div>' : '')+
      '<div class="tot-line tot-final"><span>المطلوب دفعه</span><span>'+money(discounted)+'</span></div>';
  }
  const paidEl = document.getElementById('dm_paid');
  if(paidEl) paidEl.value = discounted.toFixed(2);
}
function cancelDeliverModal(){
  const r = window.__deliverRepairId ? state.repairs.find(function(x){ return x.id===window.__deliverRepairId; }) : null;
  if(window.__deliverSelectEl && r) window.__deliverSelectEl.value = r.status;
  window.__deliverSelectEl = null;
  window.__deliverRepairId = null;
  closeModal();
}
async function confirmDeliverPayment(){
  const id = window.__deliverRepairId;
  const r = state.repairs.find(function(x){ return x.id===id; });
  if(!r) return;
  const cost = Number((r.actualCost!==undefined && r.actualCost!=='' ? r.actualCost : r.estimatedCost) || 0);
  const discount = Number(document.getElementById('dm_discount').value||0);
  const paymentMethod = document.getElementById('dm_payment').value;
  const paidAmount = Number(document.getElementById('dm_paid').value||0);
  const sendWa = document.getElementById('dm_sendwa').checked;

  r.status = 'تم التسليم';
  r.deliveredDate = todayISO();
  await persistRecord('repairs', r);
  if(!isCloud()) renderRepairs();

  const invData = {
    id: genId('i_'),
    invoiceNo: shortCode('INV'),
    createdAt: Date.now(),
    customerName: r.customerName,
    phone: r.phone,
    date: todayISO(),
    status: 'مدفوعة',
    paymentMethod: paymentMethod,
    linkedRepairId: r.id,
    items: [{desc: 'صيانة: '+r.deviceType+(r.deviceModel?(' '+r.deviceModel):'')+' — '+r.issue, qty:1, price: cost}],
    taxPercent: 0,
    discountPercent: discount,
    subtotal: cost,
    total: paidAmount
  };
  await persistRecord('invoices', invData);
  if(!isCloud()) renderInvoices();

  window.__deliverSelectEl = null;
  window.__deliverRepairId = null;
  closeModal();
  if(state.view==='dashboard') renderDashboard();
  showToast('تم تسليم الجهاز وتسجيل الدفعة');
  if(sendWa) sendStatusWhatsApp(id, 'تم التسليم');
}

async function saveRepairForm(id){
  const customerName = document.getElementById('f_customerName').value.trim();
  const phone = document.getElementById('f_phone').value.trim();
  const issue = document.getElementById('f_issue').value.trim();
  if(!customerName || !phone || !issue){
    showToast('الرجاء تعبئة اسم الزبون، الهاتف، والعطل');
    return;
  }
  const existing = id ? state.repairs.find(function(x){ return x.id===id; }) : null;
  const data = Object.assign({}, existing, {
    customerName: customerName,
    phone: phone,
    deviceType: document.getElementById('f_deviceType').value,
    deviceModel: document.getElementById('f_deviceModel').value.trim(),
    condition: document.getElementById('f_condition').value.trim(),
    issue: issue,
    receivedDate: document.getElementById('f_receivedDate').value || todayISO(),
    status: document.getElementById('f_status').value,
    estimatedCost: document.getElementById('f_estimatedCost').value,
    actualCost: document.getElementById('f_actualCost').value,
    partsCost: document.getElementById('f_partsCost').value,
    supplierName: document.getElementById('f_supplierName').value.trim(),
    supplierPhone: document.getElementById('f_supplierPhone').value.trim(),
    notes: document.getElementById('f_notes').value.trim()
  });
  const wasDelivered = existing && existing.status === 'تم التسليم';
  if(!id){
    data.id = genId('r_');
    data.ticketNo = shortCode('TM');
    data.createdAt = Date.now();
  }
  await persistRecord('repairs', data);
  if(!isCloud()) renderRepairs();
  closeModal();
  if(state.view==='dashboard') renderDashboard();
  showToast(id ? 'تم حفظ التعديلات' : 'تمت إضافة التذكرة');
  if(!id){
    sendNotification('🔧 جهاز جديد دخل قيد الصيانة — '+data.deviceType+(data.deviceModel?(' '+data.deviceModel):'')+' ('+data.customerName+')');
  }
  if(data.status === 'تم التسليم' && !wasDelivered){
    openDeliverPaymentModal(data.id, null);
  }
}

function renderInvoices(){
  const filters = ['الكل','مدفوعة','غير مدفوعة'];
  let list = state.invoices.slice().sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });
  if(state.invoiceFilter!=='الكل') list = list.filter(function(i){ return i.status===state.invoiceFilter; });

    const q = state.invoiceSearch.trim().toLowerCase();

      return (i.customerName||'').toLowerCase().indexOf(q)>-1 ||
             (i.phone||'').toLowerCase().indexOf(q)>-1 ||

  '</div>'+

    '<div class="field"><label>نسبة الخصم % <span class="opt">(اختياري)</span></label><input type="number" step="1" min="0" max="100" id="f_inv_discount" value="'+(inv&&inv.discountPercent?inv.discountPercent:0)+'" oninput="recalcInvoiceTotal()"></div>'+
    '<div class="field"><label>نسبة الضريبة % <span class="opt">(اختياري)</span></label><input type="number" step="0.1" id="f_inv_tax" value="'+(initTax||0)+'" oninput="recalcInvoiceTotal()"></div>'+
  '</div>'+
  '<div class="invoice-total-box" id="invoiceTotalBox"></div>'+

  openModal(html);
  recalcInvoiceTotal();
}
function itemRowHtml(it){
  return '<div class="item-row">'+
    '<input class="it-desc" value="'+esc(it.desc)+'" placeholder="وصف الخدمة أو المنتج" oninput="recalcInvoiceTotal()">'+
    '<input class="it-qty" type="number" min="0" step="1" value="'+it.qty+'" oninput="recalcInvoiceTotal()">'+
    '<input class="it-price" type="number" min="0" step="0.01" value="'+it.price+'" oninput="recalcInvoiceTotal()">'+
    '<button class="remove-item-btn" type="button" onclick="removeItemRow(this)">×</button>'+
  '</div>';
}
function addItemRow(){
  document.getElementById('itemsContainer').insertAdjacentHTML('beforeend', itemRowHtml({desc:'',qty:1,price:0}));
  recalcInvoiceTotal();
}
function removeItemRow(btn){
  const rows = document.querySelectorAll('#itemsContainer .item-row');
  if(rows.length<=1){ showToast('يجب أن تحتوي الفاتورة على بند واحد على الأقل'); return; }
  btn.closest('.item-row').remove();
  recalcInvoiceTotal();
}
function readInvoiceItems(){
  const rows = document.querySelectorAll('#itemsContainer .item-row');
  const items = [];
  rows.forEach(function(row){
    const desc = row.querySelector('.it-desc').value.trim();
    const qty = Number(row.querySelector('.it-qty').value||0);
    const price = Number(row.querySelector('.it-price').value||0);
    items.push({desc:desc, qty:qty, price:price});
  });
  return items;
}
function recalcInvoiceTotal(){
  const items = readInvoiceItems();
  const subtotal = items.reduce(function(s,it){ return s+(it.qty*it.price); }, 0);
  const discEl = document.getElementById('f_inv_discount');
  const discountPercent = Number((discEl && discEl.value) || 0);
  const discountAmt = subtotal * discountPercent/100;
  const afterDiscount = subtotal - discountAmt;
  const taxEl = document.getElementById('f_inv_tax');
  const taxPercent = Number((taxEl && taxEl.value) || 0);
  const taxAmt = afterDiscount * taxPercent/100;
  const total = afterDiscount + taxAmt;
  const box = document.getElementById('invoiceTotalBox');
  if(box){
    box.innerHTML = '<div class="tot-line"><span>المجموع الفرعي</span><span>'+money(subtotal)+'</span></div>'+
      (discountPercent ? '<div class="tot-line"><span>الخصم ('+discountPercent+'%)</span><span>-'+money(discountAmt)+'</span></div>' : '')+
      (taxPercent ? '<div class="tot-line"><span>الضريبة ('+taxPercent+'%)</span><span>'+money(taxAmt)+'</span></div>' : '')+
      '<div class="tot-line tot-final"><span>الإجمالي</span><span>'+money(total)+'</span></div>';
  }
  return {subtotal:subtotal, discountPercent:discountPercent, discountAmt:discountAmt, taxAmt:taxAmt, total:total, taxPercent:taxPercent};
}

async function saveInvoiceForm(id){
  const items = readInvoiceItems().filter(function(it){ return it.desc || it.qty || it.price; });
  if(items.length===0){ showToast('أضف بنداً واحداً على الأقل للفاتورة'); return; }
  const totals = recalcInvoiceTotal();
  const existing = id ? state.invoices.find(function(x){ return x.id===id; }) : null;
  const data = Object.assign({}, existing, {
    customerName: document.getElementById('f_inv_customerName').value.trim(),
    phone: document.getElementById('f_inv_phone').value.trim(),
    date: document.getElementById('f_inv_date').value || todayISO(),
    status: document.getElementById('f_inv_status').value,
    paymentMethod: document.getElementById('f_inv_payment').value,
    linkedRepairId: document.getElementById('f_inv_linked').value || null,
    items: items,
    discountPercent: totals.discountPercent,
    taxPercent: totals.taxPercent,
    subtotal: totals.subtotal,
    total: totals.total
  });
  if(!id){
    data.id = genId('i_');
    data.invoiceNo = shortCode('INV');
    data.createdAt = Date.now();
  }
  await persistRecord('invoices', data);
  if(!isCloud()) renderInvoices();
  closeModal();
  if(state.view==='dashboard') renderDashboard();
  showToast(id ? 'تم حفظ التعديلات' : 'تم إصدار الفاتورة');
}

async function toggleInvoiceStatus(id){

  inv.status = inv.status==='مدفوعة' ? 'غير مدفوعة' : 'مدفوعة';

function doPrint(html, thermal){
  document.getElementById('printArea').innerHTML = html;
  setPrintPageStyle(thermal);

}
function setPrintPageStyle(thermal){
  let tag = document.getElementById('printPageStyle');
  if(!tag){ tag = document.createElement('style'); tag.id='printPageStyle'; document.head.appendChild(tag); }
  tag.textContent = thermal
    ? '@page{size:80mm auto;margin:2mm;} #printArea{width:76mm;font-size:12px;}'
    : '@page{size:auto;margin:12mm;}';
}

  });

async function saveProductForm(id){
  const name = document.getElementById('f_prod_name').value.trim();
  const price = document.getElementById('f_prod_price').value;
  if(!name || price===''){ showToast('الرجاء إدخال اسم المنتج وسعر البيع'); return; }
  const existing = id ? state.products.find(function(x){ return x.id===id; }) : null;
  const data = Object.assign({}, existing, {
    name: name,
    code: document.getElementById('f_prod_code').value.trim(),
    quantity: Number(document.getElementById('f_prod_qty').value||0),
    price: Number(price||0),
    costPrice: Number(document.getElementById('f_prod_cost').value||0),
    notes: document.getElementById('f_prod_notes').value.trim()
  });
  if(!id){ data.id = genId('prod_'); data.createdAt = Date.now(); }
  await persistRecord('products', data);

  closeModal();
  showToast(id ? 'تم حفظ التعديلات' : 'تمت إضافة المنتج');

    sendNotification('📦 المخزون منخفض: '+name+' — الكمية المتبقية: '+data.quantity);
  }
}

function renderCustomers(){

    const key = (r.phone||r.customerName||'').trim();

    if(!map[key]) map[key] = {name:r.customerName, phone:r.phone, repairs:0, spent:0, last:0};

  });
  state.invoices.forEach(function(i){

    map[key].last = Math.max(map[key].last, i.createdAt||0);
  });
  const list = Object.values(map).sort(function(a,b){ return b.last-a.last; });

/* ================= SHIFTS (الشفتات) ================= */
async function fetchShiftSessionsForDate(date){
  if(!isCloud()) return [];
  try{
    const colRef = fsRefs.collection(fsRefs.db, shopPath('shiftSessions'));
    const q = fsRefs.query(colRef, fsRefs.where('date','==',date));
    const snap = await fsRefs.getDocs(q);
    const arr = [];
    snap.forEach(function(d){ arr.push(d.data()); });
    arr.sort(function(a,b){ return (a.startedAt||0)-(b.startedAt||0); });
    return arr;
  }catch(e){ console.error('fetchShiftSessionsForDate failed', e); return []; }
}
function shiftTotalsForDate(date){
  const shifts = {'صباحي':{sales:0, repairsRevenue:0, expenses:0, ops:0}, 'مسائي':{sales:0, repairsRevenue:0, expenses:0, ops:0}};
  state.invoices.filter(function(i){ return i.shiftDate===date && i.status==='مدفوعة'; }).forEach(function(i){
    const s = shifts[i.shift]; if(s){ s.sales += Number(i.total||0); s.ops++; }
  });
  state.repairs.filter(function(r){ return r.shiftDate===date && r.status==='تم التسليم'; }).forEach(function(r){
    const s = shifts[r.shift]; if(s){ s.repairsRevenue += Number(r.actualCost||r.estimatedCost||0); s.ops++; }
  });
  state.expenses.filter(function(e){ return e.shiftDate===date; }).forEach(function(e){
    const s = shifts[e.shift]; if(s){ s.expenses += Number(e.amount||0); s.ops++; }
  });
  return shifts;
}
async function renderShifts(){
  const date = state.shiftsReportDate || todayISO();
  state.shiftsReportDate = date;
  let html = '<div class="section-head"><h2>الشفتات</h2></div>';
  html += '<div class="panel settings-form" style="max-width:260px;"><div class="field"><label>التاريخ</label><input type="date" id="shiftsReportDateInput" value="'+date+'" onchange="onShiftsDateChange(this.value)"></div></div>';
  const totals = shiftTotalsForDate(date);
  const sessions = await fetchShiftSessionsForDate(date);
  ['صباحي','مسائي'].forEach(function(shiftName){
    const t = totals[shiftName];
    const net = t.sales + t.repairsRevenue - t.expenses;
    const workers = sessions.filter(function(s){ return s.shift===shiftName; });
    html += '<div class="panel settings-form">';
    html += '<h3>'+(shiftName==='صباحي'?'☀️ ':'🌙 ')+shiftName+'</h3>';
    html += '<div class="cc-stats" style="margin:6px 0 10px;">'+
      '<div class="cc-stat"><b>'+money(t.sales)+'</b><span>مبيعات فواتير</span></div>'+
      '<div class="cc-stat"><b>'+money(t.repairsRevenue)+'</b><span>صيانة مُسلَّمة</span></div>'+
      '<div class="cc-stat"><b>'+money(t.expenses)+'</b><span>مصاريف</span></div>'+
      '<div class="cc-stat"><b>'+money(net)+'</b><span>صافي تقريبي</span></div>'+
    '</div>';
    html += '<p class="hint">عدد العمليات المسجّلة: '+t.ops+'</p>';
    html += '<p class="hint">الموظفون الذين عملوا بهذا الشفت: '+(workers.length? workers.map(function(w){ return esc(w.employeeName); }).join('، ') : 'لا يوجد تسجيل')+'</p>';
    html += '</div>';
  });
  document.getElementById('view-shifts').innerHTML = html;
}
function onShiftsDateChange(val){
  state.shiftsReportDate = val;
  renderShifts();
}

async function setDeviceRevoked(deviceId, revoked){
  if(revoked && !confirm('هل تريد إلغاء الدخول السريع لهذا الجهاز؟ سيحتاج صاحبه لتسجيل الدخول الكامل من جديد.')) return;
  try{
    const ref = fsRefs.doc(fsRefs.db, shopPath('trustedDevices'), deviceId);
    const snap = await fsRefs.getDoc(ref);
    if(snap.exists()){
      await fsRefs.setDoc(ref, Object.assign({}, snap.data(), {revoked: revoked}));
      logAudit(revoked?'إلغاء جهاز':'إعادة تفعيل جهاز', 'trustedDevices', deviceId);
    }
    showToast(revoked ? 'تم إلغاء الجهاز' : 'تمت إعادة تفعيل الجهاز');
    renderDevices();
  }catch(e){ console.error(e); showToast('تعذّر تحديث حالة الجهاز'); }
}

const AI_QUICK_PROMPTS = [

function renderAI(){
  if(state.chat.length===0){
    state.chat.push({role:'assistant', synthetic:true, content:'مرحباً 👋 أنا مساعدك الذكي في '+state.shopInfo.name+'. بقدر ساعدك بحساب الأرباح، تتبع تذاكر الصيانة، تلخيص الفواتير المستحقة، أو أي استفسار محاسبي أو تنظيمي عن المحل. شو بتحتاج؟'});

  }
  html += '<div class="ai-quick">'+AI_QUICK_PROMPTS.map(function(p){ return '<button onclick="sendChatMessage('+esc(JSON.stringify(p))+')">'+esc(p)+'</button>'; }).join('')+'</div>';
  html += '<div class="ai-input-row"><textarea id="aiInput" rows="1" placeholder="اكتب سؤالك هنا..." onkeydown="if(event.key===\'Enter\' && !event.shiftKey){event.preventDefault();sendChatMessage(document.getElementById(\'aiInput\').value);}"></textarea>'+
    '<button class="ai-send" id="aiSendBtn" onclick="sendChatMessage(document.getElementById(\'aiInput\').value)">'+ICONS.send+'</button></div>';
